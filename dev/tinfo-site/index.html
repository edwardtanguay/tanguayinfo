<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">
	<title>Tanguay.info</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet"
		  href="styles.css">
</head>

<body class="md:bg-slate-700">
	<div id="root"
		 class="flex justify-center">
		<main
			  class="bg-slate-900 p-4 w-full md:w-[60rem] mt-0 md:mt-6 md:border border-slate-700 rounded-lg shadow-lg shadow-slate-900/50">
			<h1 class="text-3xl mb-3 text-yellow-400">Edward Tanguay</h1>
			<nav>
				<div class="md:hidden bg-slate-800 text-[1.2rem] px-4 py-2 content border border-slate-700 rounded">
					<div class="flex justify-between">
						<p><a aria-current="page"
							   class="active"
							   href="/projects">Projects</a></p>
						<p class="mt-1 cursor-pointer text-yellow-400"><svg stroke="currentColor"
								 fill="currentColor"
								 stroke-width="0"
								 viewBox="0 0 512 512"
								 height="1em"
								 width="1em"
								 xmlns="http://www.w3.org/2000/svg">
								<path d="M32 96v64h448V96H32zm0 128v64h448v-64H32zm0 128v64h448v-64H32z"></path>
							</svg></p>
					</div>
				</div>
				<div class="hidden md:block bg-slate-800 px-4 py-2 content border border-slate-700 rounded">
					<ul class="flex gap-4">
						<li><a aria-current="page"
							   class="active"
							   href="https://tanguayinfo.vercel.app/projects">Projects</a></li>
						<li><a class=""
							   href="https://tanguayinfo.vercel.app/latest">Latest</a></li>
						<li><a class=""
							   href="https://tanguayinfo.vercel.app/about">About</a></li>
					</ul>
				</div>
			</nav>
			<div class="py-4">
				<p class="mb-3">Welcome to this site.</p>
			</div>
		</main>
	</div>
</body>

</html>
